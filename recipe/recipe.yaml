schema_version: 1

context:
  name: pyccl
  version: "3.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fd6c0181381eb57345ec9b56bdcf9300c9a31a42014aa9c8ced95f31ace16795
  patches:
    - remove_setuptools_build.patch

build:
  number: 1
  skip: win

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - cmake
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - swig
  host:
    - python
    - pip
    - setuptools
    - setuptools_scm
    - fftw
    - gsl
    - numpy
    - libcblas
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  run:
    - python
    - camb >=1
    - pyyaml
    - fftw  # apparently FFTW doesn't have a run export
    - matplotlib-base
    - scipy
    - fast-pt

tests:
  - python:
      imports:
        - pyccl
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "DESC Core Cosmology Library: cosmology routines with validated numerical accuracy"
  homepage: https://github.com/LSSTDESC/CCL

extra:
  recipe-maintainers:
    - beckermr
